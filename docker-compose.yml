services:
  postgres:
    image: postgres:16-alpine
    container_name: enoch_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1a2s3d4f
      POSTGRES_DB: enoch
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
